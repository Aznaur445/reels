name: Расшифровка

# Whisper large-v3 на сервере GitHub: запускается, когда в videos/<id>/audio/ появляется clean.wav,
# и кладёт transcript.raw.json обратно в ту же папку той же ветки.
on:
  push:
    paths: ['videos/*/audio/clean.wav']
  workflow_dispatch:
    inputs:
      video:
        description: 'Папка ролика (например 2026-10-02-test). Пусто — все без расшифровки'
        required: false
      model:
        description: 'Модель Whisper'
        default: 'large-v3'

permissions:
  contents: write

concurrency:
  group: transcribe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  whisper:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Кеш модели
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.model || 'large-v3' }}
      - run: pip install faster-whisper==1.2.1
      - name: Расшифровка
        env:
          WHISPER_MODEL: ${{ inputs.model || 'large-v3' }}
          ONLY: ${{ inputs.video }}
        run: |
          for wav in videos/*/audio/clean.wav; do
            d="$(dirname "$(dirname "$wav")")"
            if [ -n "$ONLY" ] && [ "$(basename "$d")" != "$ONLY" ]; then continue; fi
            # Пересчитываем, если расшифровки нет или clean.wav изменился после неё
            if [ -f "$d/transcript.raw.json" ] && [ -z "$ONLY" ] && \
               [ "$(git log -1 --format=%ct -- "$d/transcript.raw.json")" -ge "$(git log -1 --format=%ct -- "$wav")" ]; then
              continue
            fi
            echo "== $d"
            python scripts/transcribe.py "$wav" "$d/transcript.raw.json" --model "$WHISPER_MODEL"
          done
      - name: Коммит расшифровки
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add videos/*/transcript.raw.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Нечего коммитить"; exit 0; fi
          git commit -m "Расшифровка Whisper ${WHISPER_MODEL:-large-v3}"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break; sleep $((i*5)); done
